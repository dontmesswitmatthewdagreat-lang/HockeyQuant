name: HockeyQuant
options:
  bundleIdPrefix: com.hockeyquant
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: "6S4K5557SD"
    CODE_SIGN_STYLE: Automatic

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "7.0.0"

# Explicit scheme so debug runs load the local StoreKit config (the Premium
# subscription product isn't in App Store Connect yet).
schemes:
  HockeyQuant:
    build:
      targets:
        HockeyQuant: all
    run:
      config: Debug
      storeKitConfiguration: Premium.storekit
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  HockeyQuant:
    type: application
    platform: iOS
    sources:
      - path: HockeyQuant
    dependencies:
      - package: Supabase
        product: Supabase
      - package: GoogleSignIn
        product: GoogleSignIn
      - target: HockeyQuantWidgets   # embeds the widget extension
    # NOTE: Sign in with Apple entitlement removed for free/personal-team device
    # signing. Restore this block once enrolled in the Apple Developer Program:
    #   entitlements:
    #     path: HockeyQuant/HockeyQuant.entitlements
    #     properties:
    #       com.apple.developer.applesignin: [Default]
    info:
      path: HockeyQuant/Info.plist
      properties:
        CFBundleDisplayName: HockeyQuant
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarStyle: UIStatusBarStyleDefault
        # Custom scheme for the Supabase OAuth (Google) redirect callback.
        CFBundleURLTypes:
          - CFBundleURLName: com.hockeyquant.app
            CFBundleURLSchemes:
              - com.hockeyquant.app
          # Reversed Google iOS client ID — required by GoogleSignIn SDK.
          - CFBundleURLName: google-signin
            CFBundleURLSchemes:
              - com.googleusercontent.apps.834695692940-3n835vqo1ohke342ajijcl6216bes5oj
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hockeyquant.app
        PRODUCT_NAME: HockeyQuant
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: complete

  HockeyQuantWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: HockeyQuantWidgets
      - path: HockeyQuant/Core/TeamInfo.swift   # shared: 32 teams + colors
    info:
      path: HockeyQuantWidgets/Info.plist
      properties:
        CFBundleDisplayName: HockeyQuant
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hockeyquant.app.widgets
        PRODUCT_NAME: HockeyQuantWidgets
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"        # Swift 5 mode — AppIntents' required static vars
        SWIFT_STRICT_CONCURRENCY: minimal
