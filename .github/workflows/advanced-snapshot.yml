# HockeyQuant — Advanced metrics snapshot
# Stores today's raw MoneyPuck season totals for every skater and team.
# MoneyPuck serves only current cumulative totals, so a windowed rate can only
# be recovered by differencing two snapshots — a day missed here is a day of
# history that can never be reconstructed. Idempotent per day.

name: Advanced Metrics Snapshot

on:
  schedule:
    # 11:00 UTC (~6-7 AM ET) — after franchise-challenge (10:00) and before
    # news-digest (12:00), so it isn't racing another job through a cold start.
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Render
        run: curl -s --max-time 90 "https://hockeyquant.onrender.com/health" || true

      - name: Store advanced metrics snapshot
        run: curl -s --max-time 300 -X POST "https://hockeyquant.onrender.com/api/advanced/snapshot"
