name: Keep Backend Warm

# Render free tier spins the service down after 15 idle minutes (~1 min cold
# start). A ping every 10 minutes keeps it warm; the free 750 instance-hours
# per month cover one always-on service.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -sS --max-time 90 -o /dev/null -w "health: HTTP %{http_code} in %{time_total}s\n" \
            "https://hockeyquant.onrender.com/health" || true
